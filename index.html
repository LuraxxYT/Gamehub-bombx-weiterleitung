<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1220;
}

#gamehub-main {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 1;
}

/* Hintergrund-Patch */
#patch-window {
    --patch-width: 250px;
    --patch-height: 82px;

    position: fixed;
    right: 0;
    bottom: 0;
    width: var(--patch-width);
    height: var(--patch-height);
    overflow: hidden;
    z-index: 20;
    pointer-events: none;
}

#gamehub-patch {
    position: absolute;
    left: 0;
    top: 0;
    border: 0;
    pointer-events: none;
}

/* Eigenes Branding über dem Base44-Badge */
#brand-overlay {
    position: absolute;
    inset: 0;
    z-index: 5;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(8, 14, 27, 0.94);
    color: white;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;

    pointer-events: auto;
    user-select: none;
    cursor: default;
}

#ad-layer {
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
}

@media (max-width: 600px) {
    #patch-window {
        --patch-width: 210px;
        --patch-height: 70px;
    }

    #brand-overlay {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<!-- Haupt-GameHub -->
<iframe
    id="gamehub-main"
    src="https://1gamehub.base44.app/"
    allow="fullscreen; autoplay">
</iframe>

<!-- Zweites iframe als Hintergrund-Patch -->
<div id="patch-window">

    <iframe
        id="gamehub-patch"
        src="https://1gamehub.base44.app/"
        tabindex="-1"
        aria-hidden="true">
    </iframe>

    <!-- Fängt Interaktionen mit dem Badge ab -->
    <div id="brand-overlay">
        By Dummraxx Software
    </div>

</div>

<!-- Werbung -->
<div id="ad-layer">
    <script
        src="https://quge5.com/88/tag.min.js"
        data-zone="316939"
        async
        data-cfasync="false">
    </script>
</div>

<script>
(() => {
    const patchWindow = document.getElementById("patch-window");
    const patchFrame = document.getElementById("gamehub-patch");

    function resizePatch() {
        const style = getComputedStyle(patchWindow);

        const width =
            parseFloat(style.getPropertyValue("--patch-width")) || 250;

        const height =
            parseFloat(style.getPropertyValue("--patch-height")) || 82;

        patchFrame.style.width =
            `${window.innerWidth + width}px`;

        patchFrame.style.height =
            `${window.innerHeight + height}px`;
    }

    window.addEventListener("resize", resizePatch);
    resizePatch();
})();
</script>

</body>
</html>
