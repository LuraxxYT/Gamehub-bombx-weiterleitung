
<!DOCTYPE html>
<html lang="de">
<head>
    <script src="https://quge5.com/88/tag.min.js"
            data-zone="316939"
            async
            data-cfasync="false"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Weiterleitung zu GameHub...</title>

    <link rel="canonical" href="https://1gamehub.base44.app">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 12px;
        }

        p {
            color: #94a3b8;
        }

        .timer {
            font-size: 55px;
            font-weight: bold;
            color: #38bdf8;
            margin: 25px 0;
        }

        .progress {
            height: 8px;
            background: #334155;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #38bdf8;
            transition: width 0.3s linear;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        .small {
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>GameHub</h1>

    <p>Du wirst zu GameHub weitergeleitet.</p>

    <p>Bitte warte einen Moment ...</p>

    <div class="timer" id="timer">30</div>

    <div class="progress">
        <div class="progress-bar" id="progress"></div>
    </div>

    <p id="status">Weiterleitung in 30 Sekunden</p>

    <p class="small">
        Falls die Weiterleitung nicht funktioniert:
        <a id="manualLink" href="https://1gamehub.base44.app">
            Hier klicken
        </a>
    </p>

</div>

<script>
(function () {

    const targetBase = "https://1gamehub.base44.app";

    const duration = 30;

    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    const target = targetBase + path + search + hash;

    const timerElement = document.getElementById("timer");
    const progressElement = document.getElementById("progress");
    const statusElement = document.getElementById("status");
    const manualLink = document.getElementById("manualLink");

    manualLink.href = target;

    let remaining = duration;
    let redirected = false;

    function updateTimer() {

        timerElement.textContent = remaining;

        const percentage =
            ((duration - remaining) / duration) * 100;

        progressElement.style.width = percentage + "%";

        statusElement.textContent =
            "Weiterleitung in " + remaining + " Sekunden";

        if (remaining <= 0) {

            if (redirected) return;

            redirected = true;

            timerElement.textContent = "✓";
            statusElement.textContent = "GameHub wird geöffnet ...";
            progressElement.style.width = "100%";

            window.location.replace(target);

            return;
        }

        remaining--;
    }

    updateTimer();

    const interval = setInterval(function () {

        updateTimer();

        if (redirected) {
            clearInterval(interval);
        }

    }, 1000);

})();
</script>

</body>
</html>
